# =====================================================================
# ФРАЗИ АСИСТЕНТА
# =====================================================================
# Тут зібрані всі репліки, які асистент промовляє вголос.
# Це ОРИГІНАЛЬНІ фрази, написані для цього проєкту — вони НЕ є цитатами
# з фільмів (репліки персонажа Jarvis з "Iron Man" захищені авторським
# правом, тому дослівно використовувати їх не можна).
#
# Можеш вільно редагувати цей файл вручну або через JarvisSettings.exe.
# Обери активну мову озвучення в config.yaml -> assistant.voice_language
# (uk / ru). Асистент завжди намагатиметься РОЗПІЗНАВАТИ обидві мови
# одночасно (див. config.yaml -> assistant.stt_languages), а от
# ВІДПОВІДАЄ він тією мовою, яку тут вибрано.
# =====================================================================

uk:
  greeting:
    - "Вітаю. Джарвіс на зв'язку і готовий до роботи."
    - "Системи активовано. Слухаю ваші розпорядження."
    - "Доброго дня. Все готово до роботи."

  listening:
    - "Слухаю."
    - "Так, слухаю уважно."
    - "Кажіть, я на зв'язку."

  executing:
    - "Виконую."
    - "Прийнято, займаюсь цим."
    - "Одну мить."

  thinking:
    - "Обмірковую."
    - "Хвилинку, аналізую запит."
    - "Дайте подумати."

  fail_lvl1:
    - "Перепрошую, я вас не розчув."
    - "Повторіть, будь ласка."
    - "Не зовсім розібрав фразу."

  fail_lvl2:
    - "Спробуйте сформулювати інакше."
    - "Команду не розпізнано."
    - "Здається, ми говоримо різними мовами. Спробуйте ще раз."

  fail_lvl3:
    - "Ніяк не можу розібрати, що ви маєте на увазі."
    - "Скажіть точніше, будь ласка."
    - "Спробуємо ще раз, уважніше."

  session_timeout: "Повертаюсь у режим очікування."

  ai_mode_on: "Режим вільної розмови активовано."
  ai_mode_off: "Повертаюсь у звичайний режим."
  ai_unavailable: "Наразі немає з'єднання зі штучним інтелектом."
  ai_disabled: "Цей режим вимкнено в налаштуваннях."
  ai_no_internet: "Немає доступу до інтернету, режим ІІ недоступний."
  ai_no_answer: "На жаль, відповіді отримати не вдалося."
  ai_error: "Виникла помилка під час звернення до ІІ."

  wakewords:
    - "джарвіс"
    - "джарвісе"
    - "джервіс"
    - "чарльз"

ru:
  greeting:
    - "Приветствую. Джарвис на связи и готов к работе."
    - "Системы активированы. Слушаю ваши распоряжения."
    - "Добрый день. Всё готово к работе."

  listening:
    - "Слушаю."
    - "Да, внимательно слушаю."
    - "Говорите, я на связи."

  executing:
    - "Выполняю."
    - "Принято, занимаюсь этим."
    - "Одну секунду."

  thinking:
    - "Обдумываю."
    - "Минуту, анализирую запрос."
    - "Дайте подумать."

  fail_lvl1:
    - "Извините, я вас не расслышал."
    - "Повторите, пожалуйста."
    - "Не совсем разобрал фразу."

  fail_lvl2:
    - "Попробуйте сформулировать иначе."
    - "Команда не распознана."
    - "Кажется, мы говорим на разных языках. Попробуйте снова."

  fail_lvl3:
    - "Никак не могу разобрать, что вы имеете в виду."
    - "Скажите точнее, пожалуйста."
    - "Давайте попробуем ещё раз, внимательнее."

  session_timeout: "Возвращаюсь в режим ожидания."

  ai_mode_on: "Режим свободного общения активирован."
  ai_mode_off: "Возвращаюсь в обычный режим."
  ai_unavailable: "Сейчас нет связи с искусственным интеллектом."
  ai_disabled: "Этот режим отключён в настройках."
  ai_no_internet: "Нет доступа к интернету, режим ИИ недоступен."
  ai_no_answer: "К сожалению, ответ получить не удалось."
  ai_error: "Произошла ошибка при обращении к ИИ."

  wakewords:
    - "джарвис"
    - "джарвисе"
    - "джервис"
    - "чарльз"
