# =====================================================================
# КАСТОМНІ КОМАНДИ — додавай нові команди БЕЗ написання коду.
# =====================================================================
# Кожен запис:
#   - phrases: список фраз, за якими асистент розпізнає команду
#   - type: "url" (відкрити сайт) / "path" (відкрити файл-папку-програму)
#           / "say" (просто сказати фразу)
#   - value: сама адреса / шлях / текст
#
# Приклади нижче — постав перед ними "#", якщо ще не хочеш ними
# користуватись, або зміни/додай свої. Можна редагувати і через
# JarvisSettings.exe (вкладка "Команди").
# =====================================================================

- phrases:
    - "открой гмейл"
    - "открой почту"
    - "почта"
    - "gmail"
  type: "url"
  value: "https://mail.google.com"

- phrases:
    - "открой телеграм веб"
    - "телеграм в браузере"
  type: "url"
  value: "https://web.telegram.org"

- phrases:
    - "расскажи анекдот про программистов"
  type: "say"
  value: "Сколько программистов нужно, чтобы закрутить лампочку? Ни одного, это аппаратная проблема."

